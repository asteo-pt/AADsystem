<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>천체사진 감별기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<style>
  :root{ --bg:#000; --panel:#000; --panel-2:#1A1A1A; --line:#FFF; --text:#FFF; --muted:#FFF; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; line-height:1.5; position:relative; overflow-x:hidden; }
  #stars{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .wrap{ position:relative; z-index:1; max-width:840px; margin:0 auto; padding:56px 24px 96px; }
  header{ margin-bottom:48px; }
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:clamp(28px,5vw,40px); margin:0; letter-spacing:-0.01em; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:0; padding:28px; margin-bottom:24px; }
  .card h2{ font-family:'Fraunces',serif; font-weight:500; font-size:19px; margin:0 0 4px; }
  .card .sub{ opacity:.75; font-size:13.5px; margin:0 0 20px; }
  .test-dz{ border:1.5px dashed var(--line); border-radius:0; padding:32px 18px; text-align:center; cursor:pointer; }
  .test-dz:hover{ background:var(--panel-2); }
  input[type=file]{ display:none; }
  .row-actions{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  button.btn{
    font-family:'Inter',sans-serif; background:var(--panel-2); color:var(--text);
    border:1px solid var(--line); padding:9px 16px; border-radius:0; font-size:13.5px; font-weight:500; cursor:pointer;
  }
  button.btn.primary{ background:#FFF; color:#000; font-weight:700; }
  button.btn:disabled{ opacity:.35; cursor:not-allowed; }
  .hint{ font-size:12.5px; opacity:.75; margin-top:10px; }
  .progress-track{ height:6px; background:var(--panel-2); border:1px solid var(--line); margin-top:10px; display:none; }
  .progress-fill{ height:100%; background:#FFF; width:0%; }
  #results{ display:none; }
  .verdict{ display:flex; align-items:baseline; gap:14px; margin-bottom:8px; flex-wrap:wrap; }
  .verdict .pct{ font-family:'Fraunces',serif; font-size:52px; font-weight:500; }
  .verdict .pct-label{ opacity:.75; font-size:14px; }
  .result-row{ display:flex; align-items:center; gap:12px; padding:10px 0 4px; }
  .result-block{ border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .result-block:first-child{ border-top:none; margin-top:0; padding-top:0; }
  .result-breakdown{ padding:6px 0 6px 56px; }
  .result-breakdown .feature{ margin-bottom:10px; }
  .result-breakdown .flabel{ font-size:11.5px; }
  .result-thumb{ width:44px; height:44px; object-fit:cover; border:1px solid var(--line); flex-shrink:0; }
  .result-name{ flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .result-pct{ font-family:'Fraunces',serif; font-size:18px; min-width:60px; text-align:right; }
  .result-label{ font-size:11.5px; opacity:.75; min-width:64px; text-align:right; }
  .feature{ margin-bottom:16px; }
  .feature .flabel{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; opacity:.8; }
  .feature .flabel span.name{ opacity:1; font-weight:500; }
  .bar-track{ position:relative; height:8px; background:var(--panel-2); border:1px solid var(--line); overflow:hidden; }
  .bar-fill{ position:absolute; left:0; top:0; bottom:0; background:#FFF; }
  footer{ opacity:.6; font-size:12px; margin-top:36px; max-width:560px; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <header><h1>천체사진 감별기</h1></header>

  <div class="card" id="modelCard">
    <h2>사진 판별하기</h2>
    <p class="sub" id="modelStatus">모델 불러오는 중...</p>
    <div class="test-dz" id="dzTest">
      <div id="testPlaceholder">클릭해서 사진 선택 (여러 장 선택 가능)</div>
    </div>
    <input type="file" id="fileTest" accept="image/*" multiple>
    <div class="row-actions"><button class="btn primary" id="btnRun" disabled>판별하기</button></div>
    <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
    <p class="hint" id="runStatus"></p>
  </div>

  <div class="card" id="results">
    <h2>결과</h2>
    <div class="verdict" id="singleVerdict" style="display:none;">
      <div class="pct" id="overallPct">–</div>
      <div class="pct-label" id="overallLabel">종합 — AI 생성일 가능성</div>
    </div>
    <div id="featureList"></div>
    <div id="resultList"></div>
  </div>

  <footer>모든 계산은 이 브라우저 안에서만 실행돼요. 업로드한 사진은 서버로 전송되지 않아요.</footer>
</div>

<script>
// decorative starfield
(function(){
  const c = document.getElementById('stars'); const ctx = c.getContext('2d');
  function draw(){
    ctx.clearRect(0,0,c.width,c.height); ctx.fillStyle='rgba(255,255,255,0.5)';
    const n = Math.floor((c.width*c.height)/9000); let seed=42;
    function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
    for(let i=0;i<n;i++){
      const x=rnd()*c.width, y=rnd()*c.height, r=rnd()*1.2+0.2;
      ctx.globalAlpha = rnd()*0.6+0.15;
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  function resize(){ c.width=innerWidth; c.height=innerHeight; draw(); }
  addEventListener('resize', resize); resize();
})();

let mobilenetModel = null;
let headModel = null;

async function ensureMobilenet(){
  if(mobilenetModel) return mobilenetModel;
  mobilenetModel = await mobilenet.load({version:1, alpha:0.5});
  return mobilenetModel;
}

function loadImageFile(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = reject;
    img.src = url;
  });
}

async function embedImage(img){
  const act = mobilenetModel.infer(img, true);
  const arr = await act.data();
  act.dispose();
  return Array.from(arr);
}

// 항목별(노이즈/색감/별패턴/디테일) — 학습된 모델의 "종합" 판단과는 별개로,
// 관리자가 배포한 기준 통계와 비교해서 항목별로 어느 쪽에 가까운지 보여줌
let featureStats = null;
function extractHeuristicFeatures(imgEl){
  const SIZE = 220;
  const cv = document.createElement('canvas');
  cv.width = SIZE; cv.height = SIZE;
  const ctx = cv.getContext('2d');
  const s = Math.max(SIZE/imgEl.width, SIZE/imgEl.height);
  const w = imgEl.width*s, h = imgEl.height*s;
  ctx.drawImage(imgEl, (SIZE-w)/2, (SIZE-h)/2, w, h);
  const data = ctx.getImageData(0,0,SIZE,SIZE).data;
  const n = SIZE*SIZE;
  const gray = new Float32Array(n), sat = new Float32Array(n);
  for(let i=0;i<n;i++){
    const r=data[i*4], g=data[i*4+1], b=data[i*4+2];
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    gray[i] = 0.299*r+0.587*g+0.114*b;
    sat[i] = mx===0 ? 0 : (mx-mn)/mx;
  }
  let bgSum=0,bgSqSum=0,bgN=0,brightSatSum=0,brightN=0;
  const threshold=60;
  for(let i=0;i<n;i++){
    if(gray[i]<threshold){ bgSum+=gray[i]; bgSqSum+=gray[i]*gray[i]; bgN++; }
    else { brightSatSum+=sat[i]; brightN++; }
  }
  const bgMean = bgN? bgSum/bgN : 0;
  const bgVar = bgN? (bgSqSum/bgN - bgMean*bgMean) : 0;
  const noiseScore = Math.sqrt(Math.max(bgVar,0));
  const colorScore = brightN ? brightSatSum/brightN : 0;

  let edgeSum=0, edgeN=0;
  const gxK=[-1,0,1,-2,0,2,-1,0,1], gyK=[-1,-2,-1,0,0,0,1,2,1];
  for(let y=1;y<SIZE-1;y++){
    for(let x=1;x<SIZE-1;x++){
      let gx=0,gy=0,k=0;
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        const v = gray[(y+dy)*SIZE+(x+dx)]; gx+=v*gxK[k]; gy+=v*gyK[k]; k++;
      }
      const mag = Math.sqrt(gx*gx+gy*gy);
      if(gray[y*SIZE+x] > threshold){ edgeSum+=mag; edgeN++; }
    }
  }
  const detailScore = edgeN ? edgeSum/edgeN : 0;

  let symSum=0, symN=0; const R=4;
  for(let y=R+1;y<SIZE-R-1 && symN<=40;y+=2){
    for(let x=R+1;x<SIZE-R-1 && symN<=40;x+=2){
      const v = gray[y*SIZE+x];
      if(v<200) continue;
      let isPeak=true;
      for(let dy=-1;dy<=1&&isPeak;dy++) for(let dx=-1;dx<=1;dx++){
        if(dx===0&&dy===0) continue;
        if(gray[(y+dy)*SIZE+(x+dx)]>v){ isPeak=false; break; }
      }
      if(!isPeak) continue;
      const a=gray[y*SIZE+(x-R)], b2=gray[y*SIZE+(x+R)];
      const c1=gray[(y-R)*SIZE+x], d1=gray[(y+R)*SIZE+x];
      const sym = 1 - Math.min(1,(Math.abs(a-b2)+Math.abs(c1-d1))/2/255);
      symSum+=sym; symN++;
    }
  }
  const starScore = symN ? symSum/symN : 0.5;

  const blurred = new Float32Array(n);
  for(let y=0;y<SIZE;y++){
    for(let x=0;x<SIZE;x++){
      let sum=0, cnt=0;
      for(let dy=-1;dy<=1;dy++){
        for(let dx=-1;dx<=1;dx++){
          const yy=y+dy, xx=x+dx;
          if(yy>=0&&yy<SIZE&&xx>=0&&xx<SIZE){ sum+=gray[yy*SIZE+xx]; cnt++; }
        }
      }
      blurred[y*SIZE+x] = sum/cnt;
    }
  }
  let resSum=0, resSqSum=0;
  for(let i=0;i<n;i++){ const d = gray[i]-blurred[i]; resSum+=d; resSqSum+=d*d; }
  const resMean = resSum/n;
  const patternNoise = Math.sqrt(Math.max(resSqSum/n - resMean*resMean, 0));

  return [noiseScore/60, colorScore, starScore, detailScore/80, patternNoise/12];
}

function heuristicBreakdown(testVec){
  if(!featureStats) return null;
  const { min, max, realMean, aiMean, names } = featureStats;
  return names.map((name, i)=>{
    const range = max[i]-min[i];
    const nt = range ? (testVec[i]-min[i])/range : 0.5;
    const nr = range ? (realMean[i]-min[i])/range : 0.5;
    const na = range ? (aiMean[i]-min[i])/range : 0.5;
    const dr = Math.abs(nt-nr), da = Math.abs(nt-na);
    const lean = (dr+da) ? (dr/(dr+da))*100 : 50;
    return { name, lean };
  });
}

const modelStatus = document.getElementById('modelStatus');
const dzTest = document.getElementById('dzTest');
const fileTest = document.getElementById('fileTest');
const testPlaceholder = document.getElementById('testPlaceholder');
const btnRun = document.getElementById('btnRun');
const progressTrack = document.getElementById('progressTrack');
const progressFill = document.getElementById('progressFill');
const runStatus = document.getElementById('runStatus');
const singleVerdict = document.getElementById('singleVerdict');
const resultList = document.getElementById('resultList');
let testFiles = [];

dzTest.onclick = ()=> fileTest.click();
fileTest.onchange = (e)=>{
  testFiles = Array.from(e.target.files);
  testPlaceholder.textContent = testFiles.length ? `${testFiles.length}장 선택됨` : '클릭해서 사진 선택 (여러 장 선택 가능)';
  updateRunButton();
};

function updateRunButton(){
  btnRun.disabled = !(testFiles.length && headModel);
}

btnRun.onclick = async ()=>{
  await ensureMobilenet();
  const results = document.getElementById('results');
  results.style.display = 'block';
  resultList.innerHTML = '';
  progressTrack.style.display = 'block';
  singleVerdict.style.display = testFiles.length === 1 ? 'flex' : 'none';

  const scored = [];
  for(let i=0;i<testFiles.length;i++){
    const file = testFiles[i];
    const img = await loadImageFile(file);
    const emb = await embedImage(img);
    const x = tf.tensor2d([emb]);
    const pred = headModel.predict(x);
    const [pReal, pAi] = await pred.data();
    x.dispose(); pred.dispose();
    const heur = extractHeuristicFeatures(img);
    scored.push({ name:file.name, url:URL.createObjectURL(file), pAi, heur });
    progressFill.style.width = Math.round(((i+1)/testFiles.length)*100)+'%';
    runStatus.textContent = `판별 중... ${i+1}/${testFiles.length}`;
  }
  progressTrack.style.display = 'none';
  runStatus.textContent = '';

  const featureList = document.getElementById('featureList');
  featureList.innerHTML = '';

  if(testFiles.length === 1){
    const r = scored[0];
    document.getElementById('overallPct').textContent = (r.pAi*100).toFixed(0)+'%';
    document.getElementById('overallLabel').textContent = '종합 — ' + (r.pAi>=0.5 ? 'AI 생성 쪽에 더 가까움' : '실제 사진 쪽에 더 가까움');

    const breakdown = heuristicBreakdown(r.heur);
    if(breakdown){
      breakdown.forEach(b=>{
        const row = document.createElement('div');
        row.className = 'feature';
        row.innerHTML = `
          <div class="flabel"><span class="name">${b.name}</span><span>${b.lean.toFixed(0)}% AI쪽</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${b.lean}%"></div></div>
        `;
        featureList.appendChild(row);
      });
    }
  } else {
    scored.sort((a,b)=> b.pAi-a.pAi);
    scored.forEach(r=>{
      const wrap = document.createElement('div');
      wrap.className = 'result-block';
      const breakdown = heuristicBreakdown(r.heur) || [];
      const bars = breakdown.map(b=>`
        <div class="feature">
          <div class="flabel"><span class="name">${b.name}</span><span>${b.lean.toFixed(0)}% AI쪽</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${b.lean}%"></div></div>
        </div>
      `).join('');
      wrap.innerHTML = `
        <div class="result-row">
          <img class="result-thumb" src="${r.url}">
          <div class="result-name">${r.name}</div>
          <div class="result-pct">${(r.pAi*100).toFixed(0)}%</div>
          <div class="result-label">${r.pAi>=0.5?'AI 쪽':'실제 쪽'}</div>
        </div>
        <div class="result-breakdown">${bars}</div>
      `;
      resultList.appendChild(wrap);
    });
  }
  results.scrollIntoView({behavior:'smooth', block:'start'});
};

// ---------- 배포된 모델 불러오기 ----------
(async function init(){
  try{
    headModel = await tf.loadLayersModel('./model/model.json');
    modelStatus.textContent = '';
    updateRunButton();
  }catch(e){
    modelStatus.textContent = '아직 배포된 모델이 없어요. 관리자가 모델을 배포하면 여기서 바로 판별할 수 있어요.';
  }
  try{
    const res = await fetch('./model/feature_stats.json');
    if(res.ok) featureStats = await res.json();
  }catch(e){ /* 항목별 통계 없으면 종합 %만 보여줌 */ }
})();
</script>
</body>
</html>
